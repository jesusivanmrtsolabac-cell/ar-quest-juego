<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Quest 2.0 - Robot Móvil</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.loaders.min.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      width: 100%; height: 100%;
    }

    /* Forzar que TODO el canvas de A-Frame quede detrás */
    .a-canvas, canvas.a-canvas {
      z-index: 1 !important;
    }

    /* Panel de puntuación */
    #panel {
      position: fixed; top: 10px; left: 10px;
      z-index: 99999 !important;
      background: rgba(0,0,0,0.85); color: white;
      padding: 10px 14px; border-radius: 10px;
      font-size: 15px; min-width: 130px;
    }
    #panel div { margin: 3px 0; }
    #reiniciar {
      margin-top: 6px; padding: 6px 10px; border: none;
      border-radius: 6px; cursor: pointer; width: 100%;
      background: #ff6b6b; color: white; font-weight: bold;
      font-size: 13px;
    }

    /* Info del nivel */
    #nivelInfo {
      position: fixed; top: 10px; right: 10px;
      z-index: 99999 !important;
      background: rgba(0,0,0,0.85); color: #FFD700;
      padding: 10px 14px; border-radius: 10px;
      font-size: 15px; font-weight: bold;
    }

    /* 🎮 D-PAD ROBOT */
    #controles {
      position: fixed !important;
      bottom: 25px !important;
      right: 15px !important;
      z-index: 999999 !important;
      display: grid !important;
      grid-template-columns: 65px 65px 65px;
      grid-template-rows: 65px 65px 65px;
      gap: 8px;
      opacity: 0.9;
      pointer-events: auto !important;
    }
    #controles button {
      width: 65px; height: 65px;
      border: 2px solid white;
      border-radius: 14px;
      background: rgba(30,30,30,0.9);
      color: white; font-size: 28px; font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 999999 !important;
      pointer-events: auto !important;
    }
    #controles button:active {
      background: #FFD700;
      color: #000;
      transform: scale(0.9);
    }
    #arriba     { grid-column: 2; grid-row: 1; }
    #izquierda  { grid-column: 1; grid-row: 2; }
    #centro     { grid-column: 2; grid-row: 2; background: rgba(255,215,0,0.95) !important; color: black !important; font-size: 20px !important; }
    #derecha    { grid-column: 3; grid-row: 2; }
    #abajo      { grid-column: 2; grid-row: 3; }

    /* Victoria */
    #victoria {
      display: none; position: fixed; inset: 0;
      z-index: 9999999 !important;
      background: rgba(0,0,0,0.92); color: white;
      text-align: center; padding-top: 22vh;
    }
    #victoria h1 { font-size: 40px; color: #FFD700; margin: 10px; }
    #victoria p  { font-size: 20px; margin: 6px; }
    #victoria button {
      margin-top: 22px; padding: 14px 26px; font-size: 17px;
      border: none; border-radius: 10px; cursor: pointer;
      background: #51cf66; color: white; font-weight: bold;
    }

    .a-enter-vr { display: none !important; }
  </style>
</head>

<body>

  <!-- Panel -->
  <div id="panel">
    <div>Puntos: <span id="puntos">0</span></div>
    <div>Tiempo: <span id="tiempo">90</span> s</div>
    <div>Récord: <span id="record">0</span></div>
    <button id="reiniciar">🔄 Reiniciar</button>
  </div>

  <div id="nivelInfo">Nivel <span id="nivel">1</span> / 3</div>

  <!-- 🎮 CONTROLES -->
  <div id="controles">
    <button id="arriba"    ontouchstart="event.preventDefault(); mover('arriba')" onmousedown="mover('arriba')">⬆️</button>
    <button id="izquierda" ontouchstart="event.preventDefault(); girar('izq')"    onmousedown="girar('izq')">⬅️</button>
    <button id="centro"    ontouchstart="event.preventDefault(); accion()"       onmousedown="accion()">🎯</button>
    <button id="derecha"   ontouchstart="event.preventDefault(); girar('der')"   onmousedown="girar('der')">➡️</button>
    <button id="abajo"     ontouchstart="event.preventDefault(); mover('abajo')" onmousedown="mover('abajo')">⬇️</button>
  </div>

  <!-- Victoria -->
  <div id="victoria">
    <h1>🏆 ¡VICTORIA! 🏆</h1>
    <p id="puntosFinales">Puntos: 0</p>
    <p id="recordFinal">Récord: 0</p>
    <button onclick="reiniciarJuego()">Jugar de nuevo</button>
  </div>

  <a-scene embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; antialias: true;">

    <a-marker preset="hiro" id="marcador">

      <!-- Piso -->
      <a-circle position="0 0.01 0" rotation="-90 0 0" radius="1.4"
                color="#1e3d2f" opacity="0.7"></a-circle>

      <!-- 🤖 ROBOT (más pequeño para que quepa bien) -->
      <a-entity
        id="robot"
        gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/RiggedFigure/glTF-Binary/RiggedFigure.glb"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        rotation="0 0 0"
        animation__idle="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear;">
        <a-cone position="0 0.5 -0.6" radius-bottom="0.15" radius-top="0"
                height="0.3" color="#FFD700" rotation="90 0 0"></a-cone>
      </a-entity>

      <a-entity id="contenedorMonedas"></a-entity>
      <a-entity id="contenedorEnemigos"></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
/* =========================
   VARIABLES
   ========================= */
let puntos = 0, tiempo = 90, nivel = 1;
let partidaActiva = true;
let intervaloTiempo = null;
let record = parseInt(localStorage.getItem('arQuestRecord')) || 0;

const MAX_NIVEL = 3;
const TIEMPOS    = { 1: 90, 2: 60, 3: 40 };
const MONEDAS_N  = { 1: 5,  2: 6,  3: 8 };
const ENEMIGOS_N = { 1: 2,  2: 4,  3: 6 };

let robotX = 0, robotZ = 0;
let robotRot = 0;
let robotVel = 0.08;
let robotGiro = 15;

const $puntos = document.getElementById('puntos');
const $tiempo = document.getElementById('tiempo');
const $record = document.getElementById('record');
const $nivel  = document.getElementById('nivel');
const $victoria = document.getElementById('victoria');
$record.textContent = record;

/* =========================
   SONIDOS
   ========================= */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function sonar(freq = 800, dur = 0.12, tipo = 'sine') {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = tipo; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
const sMoneda  = () => sonar(1200, 0.15, 'square');
const sEnemigo = () => sonar(180, 0.35, 'sawtooth');
const sVictoria = () => [523,659,784,1046].forEach((f,i) =>
  setTimeout(() => sonar(f, 0.25, 'triangle'), i*180));

/* =========================
   CONTROL ROBOT
   ========================= */
function actualizarRobot() {
  const robot = document.getElementById('robot');
  robot.setAttribute('position', `${robotX.toFixed(2)} 0 ${robotZ.toFixed(2)}`);
  robot.setAttribute('rotation', `0 ${robotRot} 0`);
}

function mover(dir) {
  if (!partidaActiva) return;
  const rad = (robotRot * Math.PI) / 180;
  const dx = Math.sin(rad) * robotVel;
  const dz = Math.cos(rad) * robotVel;

  if (dir === 'arriba') { robotX -= dx; robotZ -= dz; }
  if (dir === 'abajo')  { robotX += dx; robotZ += dz; }

  robotX = Math.max(-1.2, Math.min(1.2, robotX));
  robotZ = Math.max(-1.2, Math.min(1.2, robotZ));

  actualizarRobot();
  detectarColisiones();
}

function girar(sentido) {
  if (!partidaActiva) return;
  robotRot += (sentido === 'izq' ? -robotGiro : robotGiro);
  actualizarRobot();
  detectarColisiones();
}

function accion() {
  if (!partidaActiva) return;
  sonar(600, 0.1, 'square');
}

/* =========================
   COLISIONES
   ========================= */
function detectarColisiones() {
  const radioColision = 0.35;
  document.querySelectorAll('.moneda, .enemigo').forEach(obj => {
    if (!obj.getAttribute('visible')) return;

    const pos = obj.getAttribute('position');
    const dx = pos.x - robotX;
    const dz = pos.z - robotZ;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if (dist < radioColision) {
      if (obj.classList.contains('moneda')) {
        puntos += 10;
        sMoneda();
      } else if (obj.classList.contains('enemigo')) {
        puntos -= 5;
        sEnemigo();
      }
      if (puntos < 0) puntos = 0;
      $puntos.textContent = puntos;
      obj.setAttribute('visible', false);
    }
  });
}

/* =========================
   GENERADORES
   ========================= */
function posAleatoria() {
  const x = (Math.random() * 2.0 - 1.0).toFixed(2);
  const z = (Math.random() * 2.0 - 1.0).toFixed(2);
  const y = (0.4 + Math.random() * 0.5).toFixed(2);
  return `${x} ${y} ${z}`;
}

function crearMoneda() {
  const colores = ['#FFD700', '#00FFFF', '#FF69B4', '#51cf66'];
  const c = colores[Math.floor(Math.random() * colores.length)];
  const el = document.createElement('a-cylinder');
  el.setAttribute('class', 'moneda');
  el.setAttribute('radius', '0.18');
  el.setAttribute('height', '0.07');
  el.setAttribute('color', c);
  el.setAttribute('rotation', '90 0 0');
  el.setAttribute('position', posAleatoria());
  el.setAttribute('animation', 'property: rotation; to: 90 360 0; loop: true; dur: 2500');
  return el;
}

function crearEnemigo() {
  const el = document.createElement('a-cone');
  el.setAttribute('class', 'enemigo');
  el.setAttribute('radius-bottom', '0.2');
  el.setAttribute('radius-top', '0');
  el.setAttribute('height', '0.45');
  el.setAttribute('color', '#8B0000');
  el.setAttribute('position', posAleatoria());
  el.setAttribute('animation', 'property: position; dir: alternate; loop: true; dur: 800');
  return el;
}

/* =========================
   CARGAR NIVEL
   ========================= */
function cargarNivel() {
  document.getElementById('contenedorMonedas').innerHTML = '';
  document.getElementById('contenedorEnemigos').innerHTML = '';

  for (let i = 0; i < MONEDAS_N[nivel]; i++)
    document.getElementById('contenedorMonedas').appendChild(crearMoneda());

  for (let i = 0; i < ENEMIGOS_N[nivel]; i++)
    document.getElementById('contenedorEnemigos').appendChild(crearEnemigo());

  robotX = 0; robotZ = 0; robotRot = 0;
  actualizarRobot();

  tiempo = TIEMPOS[nivel];
  $tiempo.textContent = tiempo;
  $nivel.textContent = nivel;
}

/* =========================
   TEMPORIZADOR
   ========================= */
function iniciarTemporizador() {
  clearInterval(intervaloTiempo);
  intervaloTiempo = setInterval(() => {
    if (!partidaActiva) return;
    tiempo--;
    $tiempo.textContent = tiempo;

    if (tiempo <= 0) {
      clearInterval(intervaloTiempo);
      if (nivel < MAX_NIVEL) {
        nivel++;
        alert(`¡Pasaste al nivel ${nivel}!`);
        cargarNivel();
        iniciarTemporizador();
      } else {
        partidaActiva = false;
        sVictoria();
        if (puntos > record) {
          record = puntos;
          localStorage.setItem('arQuestRecord', record);
          $record.textContent = record;
        }
        document.getElementById('puntosFinales').textContent = 'Puntos: ' + puntos;
        document.getElementById('recordFinal').textContent = 'Récord: ' + record;
        $victoria.style.display = 'block';
      }
    }
  }, 1000);
}

/* =========================
   REINICIAR
   ========================= */
function reiniciarJuego() {
  puntos = 0; nivel = 1; partidaActiva = true;
  $puntos.textContent = puntos;
  $victoria.style.display = 'none';
  cargarNivel();
  iniciarTemporizador();
}

/* =========================
   INICIO
   ========================= */
window.addEventListener('load', () => {
  cargarNivel();
  iniciarTemporizador();
  document.getElementById('reiniciar').addEventListener('click', reiniciarJuego);
});
</script>

</body>
</html>
